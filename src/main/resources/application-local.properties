# Opt-in local setup; default application configuration stays unchanged.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:mysql://127.0.0.1:${DB_PORT:3309}/querypilot_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=querypilot
spring.datasource.password=${DB_PASSWORD}
server.address=127.0.0.1
server.port=${SERVER_PORT:8083}
spring.jpa.hibernate.ddl-auto=none
